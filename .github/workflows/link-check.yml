name: リンク切れの定期チェック

# 毎朝6時（日本時間）に index.html 内の全リンクを確認し、
# 切れているリンクがあれば自動で Issue を作成します。
on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 06:00 JST
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このジョブは push しないので、トークンをディスクに残さない
          persist-credentials: false

      - name: リンクチェック（lychee）
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403/429 はbot対策の可能性が高いので許容。リダイレクトも許容。
          args: >-
            --no-progress
            --accept 200,201,204,206,301,302,308,403,429
            --max-retries 3
            --timeout 40
            --user-agent "Mozilla/5.0 (link-check; kumamoto-shien-matome)"
            index.html
          output: ./lychee-report.md
          fail: false

      # 毎日新しいIssueを立てると未対応が積み上がるため、
      # 未クローズのものがあればそれを更新する
      - name: 既存の未対応Issueを探す
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --label "リンク切れ" --limit 1 \
                --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "既存Issue: ${n:-なし（新規作成します）}"

      - name: リンク切れがあればIssueを作成／更新
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          title: "【要対応】リンク切れが見つかりました（自動チェック）"
          content-filepath: ./lychee-report.md
          labels: リンク切れ, 自動チェック
