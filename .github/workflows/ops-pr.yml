name: 調査ブランチからPRを作る

# 定期メンテナンスのセッションは PR を作る手段を持たないため、
# claude/ops-update-* ブランチが push されたらこのワークフローが代わりに PR を開きます。
# 調査結果はコミットメッセージの本文に書かれている前提で、それを PR 本文に転記します。
on:
  push:
    branches:
      - "claude/ops-update-**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PRを作成（既にあれば何もしない）
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 同じブランチのPRが既に開いていれば、push は追記として扱われるので何もしない
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' || true)
          if [ -n "$existing" ]; then
            echo "PR #$existing が既に開いています。追記として扱いスキップします。"
            exit 0
          fi

          TITLE=$(git log -1 --format=%s)
          {
            git log -1 --format=%b
            echo
            echo "---"
            echo "_このPRは \`claude/ops-update-*\` ブランチへの push を検知して自動作成されました。"
            echo "内容は公式発表の確認を経ていますが、公開判断は人が行ってください。_"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > pr-body.md

          gh label create "運用" --color BFD4F2 --description "定期の運用チェック" --force
          gh pr create --base main --head "$BRANCH" \
            --title "$TITLE" --body-file pr-body.md --label "運用"
